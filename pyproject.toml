[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-devtools-mcp"
version = "0.9.6"
description = "MCP Server for WeChat DevTools CLI - 微信开发者工具 MCP 服务"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "WaterTian", email = "changewater@qq.com" }]
keywords = ["mcp", "wechat", "miniprogram", "devtools", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp[cli]",
  "pydantic>=2.0",
]

[project.optional-dependencies]
screenshot = ["pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/XXXWANG/wechat-devtools-mcp"
Repository = "https://github.com/XXXWANG/wechat-devtools-mcp.git"
Issues = "https://github.com/XXXWANG/wechat-devtools-mcp/issues"

[project.scripts]
wechat-devtools-mcp = "wechat_devtools_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["wechat_devtools_mcp"]
